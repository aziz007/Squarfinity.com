name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pre-render the site
        run: npm run build

      - name: Assemble the upload folder
        run: |
          rm -rf site && mkdir -p site/api
          cp -r dist/squarfinity/browser/. site/
          rm -f site/index.csr.html
          cp deploy/public_html/api/leads.php site/api/
          cp deploy/public_html/.htaccess site/
          ls -la site

      - name: Upload to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: site/
          server-dir: ./
